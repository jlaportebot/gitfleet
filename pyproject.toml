[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitfleet"
description = "Monitor and analyze a fleet of Git repositories — health, activity, and sync status across multiple projects"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jonathan Laporte", email = "laportej17@gmail.com"}
]
keywords = ["git", "fleet", "dashboard", "multi-repo", "health", "monitoring", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
]
dynamic = ["version"]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "jinja2>=3.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/jlaportebot/gitfleet"
Repository = "https://github.com/jlaportebot/gitfleet"
Issues = "https://github.com/jlaportebot/gitfleet/issues"

[project.scripts]
gitfleet = "gitfleet.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gitfleet.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gitfleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=gitfleet --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E", "F", "I", "UP", "W", "C4", "C90", "PL", "PTH", "RUF", "SIM", "T20", "TRY"
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.coverage.run]
source = ["gitfleet"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__:",
]